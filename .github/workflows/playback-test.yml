name: Build playback stability fix APK

on:
  push:
    branches: [fix/playback-stream-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Fetch patched core
        run: |
          git config submodule.core.url https://github.com/LuoH-AN/core.git
          git submodule update --init --recursive

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Full test build
        env:
          TEST_KEYSTORE: ${{ secrets.PLAYBACK_TEST_KEYSTORE }}
        run: |
          touch local.properties
          mkdir -p "$HOME/.android"
          test -n "$TEST_KEYSTORE"
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # Preserve the first test app, whose runner-generated signing key was not retained.
          # This package uses a persistent key so subsequent test builds can update in place.
          sed -i 's/applicationIdSuffix = ".dev"/applicationIdSuffix = ".dev.stability"/; s/versionNameSuffix = "-dev"/versionNameSuffix = "-stability-test"/' androidApp/build.gradle.kts
          sed -i 's/android:label="@string\/app_name"/android:label="SimpMusic 测试2"/' androidApp/src/main/AndroidManifest.xml
          sed -i '/abiFilters.add("x86_64")/d; /abiFilters.add("armeabi-v7a")/d' androidApp/build.gradle.kts

      - name: Build installable APK
        run: ./gradlew :androidApp:assembleDebug -PisFullBuild=true --parallel --build-cache --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          apk_path="$(find androidApp/build/outputs/apk/debug -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" dist/SimpMusic-2.6.0-stream-fix-v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-2.6.0-stream-fix-v3
          path: dist/SimpMusic-2.6.0-stream-fix-v3.apk
          compression-level: 0
          if-no-files-found: error
